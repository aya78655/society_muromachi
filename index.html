<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歴史クイズ 〜室町時代〜</title>
<style>
  :root{
    --bg: #faf6ee;
    --bg-card: #ffffff;
    --ink: #2c2620;
    --ink-soft: #6b6055;
    --accent: #a8452f;
    --accent-dark: #7c3220;
    --accent-soft: #f1ded6;
    --seiji: #c98a3b;
    --seiji-soft: #f7ead2;
    --bunka: #4a6fa5;
    --bunka-soft: #dfe8f5;
    --good: #2e7d4f;
    --good-soft: #e0f2e6;
    --bad: #b3392c;
    --bad-soft: #fbe3df;
    --border: #e4dccd;
    --shadow: 0 4px 16px rgba(60, 45, 25, 0.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #1c1712;
      --bg-card: #2a231c;
      --ink: #f2ece1;
      --ink-soft: #b8ac9b;
      --accent: #e0836a;
      --accent-dark: #f0a58f;
      --accent-soft: #3c2b23;
      --seiji: #e0ac5f;
      --seiji-soft: #3a2f1e;
      --bunka: #8fb0e0;
      --bunka-soft: #212f42;
      --good: #6fce97;
      --good-soft: #1c3327;
      --bad: #e58879;
      --bad-soft: #3a201d;
      --border: #423a30;
      --shadow: 0 4px 16px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg: #1c1712;
    --bg-card: #2a231c;
    --ink: #f2ece1;
    --ink-soft: #b8ac9b;
    --accent: #e0836a;
    --accent-dark: #f0a58f;
    --accent-soft: #3c2b23;
    --seiji: #e0ac5f;
    --seiji-soft: #3a2f1e;
    --bunka: #8fb0e0;
    --bunka-soft: #212f42;
    --good: #6fce97;
    --good-soft: #1c3327;
    --bad: #e58879;
    --bad-soft: #3a201d;
    --border: #423a30;
    --shadow: 0 4px 16px rgba(0,0,0,0.35);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Meiryo", sans-serif;
    min-height: 100vh;
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }

  .wrap{
    max-width: 680px;
    margin: 0 auto;
    padding: 20px 16px 56px;
  }

  header.top{
    text-align: center;
    padding: 22px 0 8px;
  }
  header.top .kicker{
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--accent);
    font-weight: 700;
  }
  header.top h1{
    margin: 6px 0 2px;
    font-size: clamp(22px, 5.5vw, 30px);
    font-weight: 800;
    letter-spacing: 0.02em;
  }
  header.top p.sub{
    margin: 0;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .card{
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 22px 20px;
    margin-top: 18px;
  }

  h2.section-title{
    font-size: 15px;
    font-weight: 700;
    color: var(--ink-soft);
    margin: 0 0 12px;
  }

  .choice-grid{
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }
  @media (min-width: 480px){
    .era-grid{ grid-template-columns: 1fr 1fr 1fr; }
    .mode-grid{ grid-template-columns: 1fr 1fr; }
  }

  .pick{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-radius: 14px;
    border: 2px solid var(--border);
    background: var(--bg);
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
    text-align: left;
  }
  .pick:hover{ transform: translateY(-1px); }
  .pick.selected{
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent-dark);
  }
  .pick .dot{
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--border);
    flex: none;
  }
  .pick.selected .dot{ background: var(--accent); }

  .row-gap{ margin-top: 18px; }

  button.primary{
    display: block;
    width: 100%;
    padding: 15px 18px;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.03em;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(168,69,47,0.28);
    transition: transform .1s ease, background .15s ease;
  }
  button.primary:hover{ background: var(--accent-dark); }
  button.primary:active{ transform: scale(0.98); }
  button.primary:disabled{
    opacity: .5; cursor: not-allowed; box-shadow:none;
  }

  button.ghost{
    display: block;
    width: 100%;
    padding: 13px 18px;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink-soft);
    background: transparent;
    border: 2px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
    margin-top: 10px;
  }

  /* quiz screen */
  .quiz-meta{
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 10px;
    font-weight: 600;
  }
  .era-tag{
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
  }
  .era-tag.seiji{ background: var(--seiji-soft); color: var(--seiji); }
  .era-tag.bunka{ background: var(--bunka-soft); color: var(--bunka); }

  .progress-track{
    height: 8px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-fill{
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width .3s ease;
  }

  .question-text{
    font-size: 18px;
    font-weight: 700;
    margin: 4px 0 20px;
    line-height: 1.75;
  }

  .choice-btn{
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    border-radius: 14px;
    border: 2px solid var(--border);
    background: var(--bg);
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    margin-bottom: 10px;
    transition: border-color .15s ease, background .15s ease;
  }
  .choice-btn .letter{
    flex: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--border);
    color: var(--ink-soft);
    font-size: 13px;
    font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .choice-btn:hover:not(:disabled){ border-color: var(--accent); }
  .choice-btn:disabled{ cursor: default; }

  .choice-btn.correct{
    border-color: var(--good);
    background: var(--good-soft);
  }
  .choice-btn.correct .letter{ background: var(--good); color: #fff; }

  .choice-btn.wrong{
    border-color: var(--bad);
    background: var(--bad-soft);
  }
  .choice-btn.wrong .letter{ background: var(--bad); color: #fff; }

  /* typed (記述式) answer input */
  .type-input{
    width: 100%;
    padding: 14px 16px;
    border-radius: 14px;
    border: 2px solid var(--border);
    background: var(--bg);
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    font-family: inherit;
    margin-bottom: 10px;
  }
  .type-input:focus{ outline: none; border-color: var(--accent); }
  .type-input.correct{ border-color: var(--good); background: var(--good-soft); }
  .type-input.wrong{ border-color: var(--bad); background: var(--bad-soft); }
  .type-input:disabled{ opacity: 0.9; }
  .type-hint{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: -2px 0 10px;
  }

  .answer-reveal{
    display: none;
    margin-bottom: 8px;
    font-size: 14.5px;
    font-weight: 700;
  }
  .answer-reveal b{ color: var(--accent-dark); font-size: 16px; }

  .explain{
    margin-top: 6px;
    padding: 14px 16px;
    border-radius: 14px;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    font-size: 14px;
    color: var(--ink);
    display: none;
  }
  .explain.show{ display: block; }
  .explain b{ color: var(--accent-dark); }

  /* correct / wrong result badge, shown to the left of "解説：" */
  .result-badge{
    display: inline-block;
    padding: 3px 11px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 800;
    margin-right: 8px;
    vertical-align: middle;
    transform: scale(0.7);
    opacity: 0;
  }
  .result-badge.show{
    animation: badge-pop .35s cubic-bezier(.26,1.4,.4,1) forwards;
  }
  .result-badge.correct{
    background: var(--good-soft);
    color: var(--good);
    border: 1.5px solid var(--good);
  }
  .result-badge.wrong{
    background: var(--bad-soft);
    color: var(--bad);
    border: 1.5px solid var(--bad);
  }
  @keyframes badge-pop{
    0%{ transform: scale(0.6); opacity: 0; }
    60%{ transform: scale(1.12); opacity: 1; }
    100%{ transform: scale(1); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce){
    .result-badge.show{ animation: none; transform: scale(1); opacity: 1; }
  }

  /* results */
  .score-hero{
    text-align: center;
    padding: 10px 0 6px;
  }
  .score-hero .num{
    font-size: 52px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
  }
  .score-hero .denom{
    font-size: 16px;
    color: var(--ink-soft);
    margin-top: 4px;
  }
  .score-hero .msg{
    margin-top: 10px;
    font-size: 15px;
    font-weight: 700;
  }

  .review-item{
    border-top: 1px solid var(--border);
    padding: 14px 0;
  }
  .review-item:first-child{ border-top: none; }
  .review-q{ font-weight: 700; font-size: 14.5px; margin-bottom: 6px; }
  .review-a{ font-size: 13.5px; color: var(--ink-soft); }
  .review-a .your{ color: var(--bad); font-weight: 700; }
  .review-a .right{ color: var(--good); font-weight: 700; }

  .hidden{ display: none !important; }

  footer.foot{
    text-align: center;
    margin-top: 30px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  /* ---- まちがえ帳（保存された間違えた問題） ---- */
  .saved-wrong-box{
    margin-top: 22px;
    padding: 16px;
    border: 2px dashed var(--border);
    border-radius: 14px;
  }
  .saved-wrong-title{ font-weight: 800; font-size: 15px; margin-bottom: 6px; }
  .saved-wrong-desc{ font-size: 13px; color: var(--ink-soft); margin-bottom: 12px; line-height: 1.6; }
  .saved-wrong-list{ margin-top: 10px; font-size: 13px; line-height: 1.6; }
  .saved-wrong-list .review-item{ padding: 10px 0; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="kicker">社会・歴史</div>
    <h1>室町時代クイズ</h1>
    <p class="sub">予習シリーズ 第7回のまとめ問題から出題（よく出る・まちがえやすい問題）</p>
  </header>

  <!-- ===== SETUP SCREEN ===== -->
  <div id="screen-setup" class="card">
    <h2 class="section-title">① 範囲をえらぶ</h2>
    <div class="choice-grid era-grid" id="era-picker">
      <div class="pick selected" data-era="all"><span class="dot"></span>ぜんぶ</div>
      <div class="pick" data-era="seiji"><span class="dot"></span>政治・外交（1〜3・年表）</div>
      <div class="pick" data-era="bunka"><span class="dot"></span>産業・文化・一揆（4〜7）</div>
    </div>

    <h2 class="section-title row-gap">② 問題数をえらぶ</h2>
    <div class="choice-grid era-grid" id="count-picker">
      <div class="pick" data-count="10"><span class="dot"></span>10問</div>
      <div class="pick" data-count="20"><span class="dot"></span>20問</div>
      <div class="pick selected" data-count="all"><span class="dot"></span>全問</div>
    </div>

    <h2 class="section-title row-gap">③ 回答方法をえらぶ</h2>
    <div class="choice-grid mode-grid" id="mode-picker">
      <div class="pick selected" data-mode="choice"><span class="dot"></span>4択（選択式）</div>
      <div class="pick" data-mode="type"><span class="dot"></span>記述式（入力）</div>
    </div>

    <div class="row-gap">
      <button class="primary" id="btn-start">クイズをはじめる</button>

    <!-- まちがえ帳：間違えた問題をブラウザに保存 -->
    <div id="saved-wrong-box" class="saved-wrong-box" style="display:none;">
      <div class="saved-wrong-title">📒 まちがえ帳</div>
      <div class="saved-wrong-desc" id="saved-wrong-desc"></div>
      <button class="primary" id="btn-saved-wrong" style="background: var(--bad); box-shadow: 0 4px 14px rgba(179,57,44,0.28);">まちがえ帳の問題に挑戦</button>
      <button class="ghost" id="btn-saved-wrong-list">一覧を見る</button>
      <div id="saved-wrong-list" class="saved-wrong-list hidden"></div>
      <button class="ghost" id="btn-saved-wrong-clear">まちがえ帳をリセット</button>
    </div>
    </div>
  </div>

  <!-- ===== QUIZ SCREEN ===== -->
  <div id="screen-quiz" class="card hidden">
    <div class="quiz-meta">
      <span id="q-counter">問題 1 / 10</span>
      <span id="q-era-tag" class="era-tag seiji">政治・外交</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>

    <div class="question-text" id="q-text">問題文がここに入ります</div>

    <div id="choices-holder"></div>

    <div class="explain" id="explain-box">
      <div class="answer-reveal" id="answer-reveal"></div>
      <span class="result-badge" id="result-badge"></span>
      <b>解説：</b><span id="explain-text"></span>
    </div>

    <div class="row-gap">
      <button class="primary" id="btn-next" disabled>次へ</button>
    </div>
  </div>

  <!-- ===== RESULT SCREEN ===== -->
  <div id="screen-result" class="card hidden">
    <div class="score-hero">
      <div class="num"><span id="res-score">0</span>/<span id="res-total">0</span></div>
      <div class="denom">正解</div>
      <div class="msg" id="res-msg"></div>
    </div>

    <div id="review-holder" class="row-gap"></div>

    <div class="row-gap">
      <button class="primary" id="btn-retry-wrong" style="background: var(--bad); box-shadow: 0 4px 14px rgba(179,57,44,0.28); display:none;">間違えた問題だけやり直す</button>
      <button class="primary" id="btn-retry" style="margin-top:10px;">もう一度おなじ設定で挑戦</button>
      <button class="ghost" id="btn-setting">設定にもどる</button>
    </div>
  </div>

  <footer class="foot">全て自分でノートを見直して確認しよう ✎</footer>
</div>

<script>
/* ===========================================================
   QUIZ DATA — 室町時代　政治・外交(seiji) / 産業・文化・一揆(bunka)
   alt: 記述式で正解にする別解 / choiceOnly: 4択のときだけ出題
   =========================================================== */
const QUESTIONS = [
  // ---------------- 1 建武の新政と南北朝の争い ----------------
  {era:"seiji", q:"1333年、鎌倉幕府をたおした天皇はだれですか。",
   choices:["後醍醐天皇","後鳥羽上皇","後白河上皇","桓武天皇"], a:0, alt:["後醍醐"],
   note:"1333年、後醍醐天皇が鎌倉幕府をたおしました。承久の乱を起こした「後鳥羽上皇」とまちがえやすいので注意。"},
  {era:"seiji", q:"鎌倉幕府がほろびたのは何年ですか。",
   choices:["1221年","1333年","1338年","1392年"], a:1, alt:["1333"],
   note:"1333年、鎌倉幕府が滅亡しました。1338年（足利尊氏が征夷大将軍）とまちがえないように。"},
  {era:"seiji", q:"後醍醐天皇が自ら行った、天皇中心の政治を何といいますか。",
   choices:["院政","摂関政治","建武の新政","執権政治"], a:2, alt:["建武新政"],
   note:"後醍醐天皇が1334年に始めた政治を建武の新政といいます。"},
  {era:"seiji", q:"建武の新政が2年ほどでくずれた主な理由として正しいものはどれですか。",
   choices:["武士のしきたりを無視し、天皇に権力が集中したので、武士たちの不満が高まったから","元が再び攻めてきたから","農民が一揆を起こして京都を占領したから","天皇が政治を幕府にまかせたから"], a:0, choiceOnly:true,
   note:"建武の新政は公家（貴族）を重んじ、武士のしきたりを無視したため、武士たちの不満が高まりました。"},
  {era:"seiji", q:"武家政治の再建をめざして兵をあげ、建武の新政をたおした人物はだれですか。",
   choices:["足利義満","足利尊氏","足利義政","北条時宗"], a:1, alt:["足利尊氏"],
   note:"足利尊氏が武家政治の再建をめざして兵をあげました。「尊氏・義満・義政」の区別はよく問われます。"},
  {era:"seiji", q:"足利尊氏が京都に別の天皇をたてたため、後醍醐天皇がのがれて南朝をたてた場所はどこですか。",
   choices:["吉野","鎌倉","奈良の平城京","比叡山"], a:0,
   note:"後醍醐天皇は吉野（現在の奈良県）にのがれ、南朝をたてました。京都の朝廷が北朝です。"},
  {era:"seiji", q:"吉野の南朝と、京都の北朝が対立した、約60年間続いた内乱を何といいますか。",
   choices:["応仁の乱","承久の乱","南北朝の内乱","保元の乱"], a:2, alt:["南北朝の内乱","南北朝","南北朝の争い"],
   note:"南朝（吉野）と北朝（京都）の争いを南北朝の内乱といい、約60年間続きました。"},
  {era:"seiji", q:"南朝が置かれた吉野は、現在の何県にありますか。",
   choices:["京都府","奈良県","滋賀県","和歌山県"], a:1, alt:["奈良"],
   note:"吉野は現在の奈良県です。"},
  {era:"seiji", q:"足利尊氏が征夷大将軍に任命されたのは何年ですか。",
   choices:["1192年","1333年","1338年","1378年"], a:2, alt:["1338"],
   note:"1338年、足利尊氏は征夷大将軍に任命され、京都に幕府を開きました。"},
  {era:"seiji", q:"室町幕府で、将軍をたすける役職を何といいますか。",
   choices:["執権","管領","摂政","老中"], a:1,
   note:"室町幕府で将軍をたすけたのは管領です。鎌倉幕府の「執権」とまちがえやすいので注意！"},
  {era:"seiji", q:"「執権」と「管領」について正しい組み合わせはどれですか。",
   choices:["執権＝鎌倉幕府、管領＝室町幕府","執権＝室町幕府、管領＝鎌倉幕府","どちらも鎌倉幕府の役職","どちらも室町幕府の役職"], a:0, choiceOnly:true,
   note:"将軍をたすける役職は、鎌倉幕府では執権（北条氏）、室町幕府では管領です。"},

  // ---------------- 2 室町幕府の全盛とおとろえ ----------------
  {era:"seiji", q:"守護大名を従えて勢力を強め、室町幕府の全盛期を築いた3代将軍はだれですか。",
   choices:["足利尊氏","足利義満","足利義政","足利義昭"], a:1, alt:["義満"],
   note:"3代将軍足利義満のころ、室町幕府は全盛期をむかえました。"},
  {era:"seiji", q:"1378年、足利義満が京都の室町に建てた邸宅を何といいますか。",
   choices:["花の御所","平等院","六波羅探題","二条城"], a:0, alt:["花の御所"],
   note:"義満は京都の室町に「花の御所」を建てました。これが「室町幕府」「室町時代」の名前の由来です。"},
  {era:"seiji", q:"「室町時代」という名前の由来として正しいものはどれですか。",

   note:"正長の土一揆（1428年）＝徳政令、山城国一揆（1485年）＝8年間の自治、加賀の一向一揆（1488年）＝100年近く支配。"},

  // ---------------- 年表（ならびかえ） ----------------
  {era:"seiji", q:"次のできごとを古い順に正しくならべたものはどれですか。",

   note:"1333年 鎌倉幕府の滅亡 → 1334年 建武の新政 → 1392年 南北朝の合一 → 1467年 応仁の乱。"},
  {era:"bunka", q:"次のできごとを古い順に正しくならべたものはどれですか。",
   choices:["金閣が建てられる → 正長の土一揆 → 応仁の乱 → 銀閣が建てられる","銀閣が建てられる → 金閣が建てられる → 応仁の乱 → 正長の土一揆","応仁の乱 → 金閣が建てられる → 正長の土一揆 → 銀閣が建てられる","金閣が建てられる → 応仁の乱 → 銀閣が建てられる → 正長の土一揆"], a:0, choiceOnly:true,
   note:"1397年 金閣 → 1428年 正長の土一揆 → 1467年 応仁の乱 → 1489年 銀閣。"},

/* ===========================================================
   APP LOGIC
   =========================================================== */
let state = {
  era: "all",
  count: "all",
  mode: "choice",
  pool: [],
  idx: 0,
  score: 0,
  answered: false,
  wrong: [],
  wrongOnlyMode: false
};

const eraLabel = {seiji:"政治・外交", bunka:"産業・文化"};

// references to the current 記述式 input/button (rebuilt every question,
// so we avoid fixed ids — see submitTypedAnswer)
let typeInputEl = null;
let typeSubmitBtnEl = null;

/* ---- まちがえ帳（ブラウザの localStorage に保存） ----
   間違えた問題を問題文をキーにして保存する。
   あとで正解すると、まちがえ帳から自動で消える。 */
const WRONG_KEY = 'muromachi_quiz_wrongbook_v1';

function loadWrongBook(){
  try{
    const v = JSON.parse(localStorage.getItem(WRONG_KEY) || '{}');
    return (v && typeof v === 'object') ? v : {};
  }catch(e){ return {}; }
}
function saveWrongBook(book){
  try{ localStorage.setItem(WRONG_KEY, JSON.stringify(book)); }catch(e){}
}
function recordResult(item, isCorrect){
  const book = loadWrongBook();
  if(isCorrect){
    delete book[item.q];
  } else {
    const prev = book[item.q] || {count: 0};
    book[item.q] = {count: prev.count + 1, last: Date.now()};
  }
  saveWrongBook(book);
}
function savedWrongQuestions(){
  const book = loadWrongBook();
  return QUESTIONS.filter(q => book[q.q]);
}
function renderSavedWrongBox(){
  const box = document.getElementById('saved-wrong-box');
  if(!box) return;
  const list = savedWrongQuestions();
  if(list.length === 0){ box.style.display = 'none'; return; }
  const book = loadWrongBook();
  box.style.display = 'block';
  document.getElementById('saved-wrong-desc').textContent =
    `いま ${list.length}問 保存されています。正解すると自動でまちがえ帳から消えます。（①②の設定に関係なく保存された問題が全部出ます。③の回答方法は反映されます）`;
  document.getElementById('btn-saved-wrong').textContent = `まちがえ帳の${list.length}問に挑戦`;
  const holder = document.getElementById('saved-wrong-list');
  holder.innerHTML = '';
  list.forEach(q => {
    const div = document.createElement('div');
    div.className = 'review-item';
    div.innerHTML = `
      <div class="review-q">${q.q}</div>
      <div class="review-a">正解：<span class="right">${q.choices[q.a]}</span>（まちがえた回数：${book[q.q].count}回）</div>
    `;
    holder.appendChild(div);
  });
}
function startSavedWrongQuiz(){
  let base = savedWrongQuestions();
  if(state.mode === 'type') base = base.filter(q => !q.choiceOnly);
  if(base.length === 0){
    alert('記述式で出せる問題がありません。③で「4択」をえらんでください。');
    return;
  }
  state.pool = shuffle(base).map(reshuffleItem);
  state.idx = 0;
  state.score = 0;
  state.wrong = [];
  state.wrongOnlyMode = true;
  showScreen('quiz');
  renderQuestion();
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// lenient compare for typed (記述式) answers: ignore surrounding/inner
// whitespace, full-width spaces, and common bracket/punctuation marks.
function normalizeAnswer(str){
  return (str || '')
    .trim()
    .replace(/[\s　]/g, '')
    .replace(/[「」『』()（）,.、。・=＝]/g, '')
    .toLowerCase();
}

/* ---- setup screen interactions ---- */
document.querySelectorAll('#era-picker .pick').forEach(el=>{
  el.addEventListener('click', ()=>{
    document.querySelectorAll('#era-picker .pick').forEach(x=>x.classList.remove('selected'));
    el.classList.add('selected');
    state.era = el.dataset.era;
  });
});
document.querySelectorAll('#count-picker .pick').forEach(el=>{
  el.addEventListener('click', ()=>{
    document.querySelectorAll('#count-picker .pick').forEach(x=>x.classList.remove('selected'));
    el.classList.add('selected');
    state.count = el.dataset.count;
  });
});
document.querySelectorAll('#mode-picker .pick').forEach(el=>{
  el.addEventListener('click', ()=>{
    document.querySelectorAll('#mode-picker .pick').forEach(x=>x.classList.remove('selected'));
    el.classList.add('selected');
    state.mode = el.dataset.mode;
  });
});

document.getElementById('btn-start').addEventListener('click', startQuiz);
document.getElementById('btn-retry').addEventListener('click', startQuiz);
document.getElementById('btn-retry-wrong').addEventListener('click', startWrongOnlyQuiz);
document.getElementById('btn-setting').addEventListener('click', ()=>{
  showScreen('setup');
});
document.getElementById('btn-next').addEventListener('click', nextQuestion);

document.getElementById('btn-saved-wrong').addEventListener('click', startSavedWrongQuiz);
document.getElementById('btn-saved-wrong-list').addEventListener('click', ()=>{
  const l = document.getElementById('saved-wrong-list');
  l.classList.toggle('hidden');
  document.getElementById('btn-saved-wrong-list').textContent =
    l.classList.contains('hidden') ? '一覧を見る' : '一覧をとじる';
});
document.getElementById('btn-saved-wrong-clear').addEventListener('click', ()=>{
  if(confirm('まちがえ帳の記録をすべて消しますか？')){
    saveWrongBook({});
    renderSavedWrongBox();
  }
});
renderSavedWrongBox();

function reshuffleItem(q){
  // shuffle choice order, tracking correct index
  const order = shuffle(q.choices.map((c,i)=>i));
  const choices = order.map(i=>q.choices[i]);
  const a = order.indexOf(q.a);
  return {era:q.era, q:q.q, note:q.note, alt:q.alt, choices, a};
}

function buildPool(){
  let base = QUESTIONS;
  if(state.era !== 'all') base = base.filter(q=>q.era===state.era);
  // 文章で答える問題は4択のときだけ出題
  if(state.mode === 'type') base = base.filter(q=>!q.choiceOnly);

  let pool = shuffle(base).map(reshuffleItem);

  if(state.count !== 'all'){
    pool = pool.slice(0, parseInt(state.count, 10));
  }
  return pool;
}

function startQuiz(){
  state.pool = buildPool();
  state.idx = 0;
  state.score = 0;
  state.wrong = [];
  state.wrongOnlyMode = false;
  showScreen('quiz');
  renderQuestion();
}

function startWrongOnlyQuiz(){
  if(state.wrong.length === 0) return;
  const items = state.wrong.map(w => w.orig);
  state.pool = shuffle(items).map(reshuffleItem);
  state.idx = 0;
  state.score = 0;
  state.wrong = [];
  state.wrongOnlyMode = true;
  showScreen('quiz');
  renderQuestion();
}

function showScreen(name){
  if(name === 'setup') renderSavedWrongBox();
  document.getElementById('screen-setup').classList.toggle('hidden', name!=='setup');
  document.getElementById('screen-quiz').classList.toggle('hidden', name!=='quiz');
  document.getElementById('screen-result').classList.toggle('hidden', name!=='result');
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderQuestion(){
  const total = state.pool.length;
  const item = state.pool[state.idx];
  state.answered = false;

  document.getElementById('q-counter').textContent = `問題 ${state.idx+1} / ${total}`;
  const tag = document.getElementById('q-era-tag');
  tag.textContent = eraLabel[item.era];
  tag.className = 'era-tag ' + item.era;

  document.getElementById('progress-fill').style.width = ((state.idx)/total*100) + '%';

  document.getElementById('q-text').textContent = item.q;

  const holder = document.getElementById('choices-holder');
  holder.innerHTML = '';

  if(state.mode === 'type'){
    // build the input via createElement (not innerHTML) and give it a
    // fresh random name/id every question, so browsers can't match it
    // against previously-saved autofill entries and leak the answer.
    const uniq = 'q' + state.idx + '_' + Math.random().toString(36).slice(2) + Date.now();

    const input = document.createElement('input');
    input.type = 'text';
    input.id = 'ti_' + uniq;
    input.name = 'ti_' + uniq;
    input.className = 'type-input';
    input.placeholder = 'ひらがな・漢字で入力してね';
    input.autocomplete = 'off';
    input.setAttribute('autocapitalize', 'off');
    input.setAttribute('autocorrect', 'off');
    input.spellcheck = false;
    // readonly-until-focus trick: most browsers refuse to offer saved
    // autofill/prediction chips for a field that was readonly when the
    // page loaded, even after we lift the readonly on focus.
    input.readOnly = true;
    input.addEventListener('focus', ()=> input.removeAttribute('readonly'), {once:true});

    const hint = document.createElement('div');
    hint.className = 'type-hint';
    hint.textContent = '用語を正しく入力して「こたえる」を押してね';

    const submitBtn = document.createElement('button');
    submitBtn.type = 'button';
    submitBtn.className = 'primary';
    submitBtn.id = 'sb_' + uniq;
    submitBtn.textContent = 'こたえる';

    holder.appendChild(input);
    holder.appendChild(hint);
    holder.appendChild(submitBtn);

    typeInputEl = input;
    typeSubmitBtnEl = submitBtn;

    submitBtn.addEventListener('click', submitTypedAnswer);
    input.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){ e.preventDefault(); submitTypedAnswer(); }
    });
    // no auto-focus on purpose: focusing an input right as it's created
    // (before the user has tapped it) is what makes some mobile browsers
    // treat it as "already active" and offer saved-value predictions.
    // Waiting for a real tap keeps the readonly-until-focus trick effective.
  } else {
    const letters = ['A','B','C','D'];
    item.choices.forEach((choiceText, i)=>{
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${choiceText}</span>`;
      btn.addEventListener('click', ()=>selectChoice(i, btn));
      holder.appendChild(btn);
    });
  }

  const explainBox = document.getElementById('explain-box');
  explainBox.classList.remove('show');
  document.getElementById('explain-text').textContent = '';

  const reveal = document.getElementById('answer-reveal');
  reveal.style.display = 'none';
  reveal.innerHTML = '';

  const badge = document.getElementById('result-badge');
  badge.classList.remove('show', 'correct', 'wrong');
  badge.textContent = '';

  const nextBtn = document.getElementById('btn-next');
  nextBtn.disabled = true;
  nextBtn.textContent = (state.idx === total-1) ? '結果を見る' : '次へ';
}

function submitTypedAnswer(){
  if(state.answered) return;
  const item = state.pool[state.idx];
  const input = typeInputEl;
  const submitBtn = typeSubmitBtnEl;
  if(!input || !submitBtn) return;
  const userText = input.value.trim();
  const correctText = item.choices[item.a];
  const accepted = [correctText].concat(item.alt || []).map(normalizeAnswer);
  const isCorrect = userText.length > 0 && accepted.includes(normalizeAnswer(userText));
  recordResult(item, isCorrect);

  state.answered = true;
  input.disabled = true;
  submitBtn.disabled = true;
  input.classList.add(isCorrect ? 'correct' : 'wrong');

  const badge = document.getElementById('result-badge');
  if(isCorrect){
    state.score++;
    badge.textContent = '⭕ 正解';
    badge.classList.add('correct');
  } else {
    state.wrong.push({
      orig: item,
      q: item.q,
      your: userText || '（未回答）',
      right: correctText,
      note: item.note
    });
    badge.textContent = '❌ 不正解';
    badge.classList.add('wrong');
  }
  badge.classList.remove('show');
  void badge.offsetWidth;
  badge.classList.add('show');

  const reveal = document.getElementById('answer-reveal');
  reveal.style.display = 'block';
  reveal.innerHTML = `正解：<b>${correctText}</b>`;

  document.getElementById('explain-text').textContent = item.note;
  document.getElementById('explain-box').classList.add('show');
  document.getElementById('btn-next').disabled = false;
}

function selectChoice(i, btnEl){
  if(state.answered) return;
  state.answered = true;

  const item = state.pool[state.idx];
  const buttons = document.querySelectorAll('#choices-holder .choice-btn');
  buttons.forEach(b=> b.disabled = true);

  const badge = document.getElementById('result-badge');

  recordResult(item, i === item.a);

  if(i === item.a){
    btnEl.classList.add('correct');
    state.score++;
    badge.textContent = '⭕ 正解';
    badge.classList.add('correct');
  } else {
    btnEl.classList.add('wrong');
    buttons[item.a].classList.add('correct');
    state.wrong.push({
      orig: item,
      q: item.q,
      your: item.choices[i],
      right: item.choices[item.a],
      note: item.note
    });
    badge.textContent = '❌ 不正解';
    badge.classList.add('wrong');
  }
  // restart animation even if same class was already shown
  badge.classList.remove('show');
  void badge.offsetWidth;
  badge.classList.add('show');

  document.getElementById('explain-text').textContent = item.note;
  document.getElementById('explain-box').classList.add('show');
  document.getElementById('btn-next').disabled = false;
}

function nextQuestion(){
  const total = state.pool.length;
  if(state.idx < total-1){
    state.idx++;
    renderQuestion();
  } else {
    finishQuiz();
  }
}

function finishQuiz(){
  const total = state.pool.length;
  document.getElementById('progress-fill').style.width = '100%';

  document.getElementById('res-score').textContent = state.score;
  document.getElementById('res-total').textContent = total;

  const pct = Math.round((state.score/total)*100);
  let msg = '';
  if(pct === 100) msg = '満点！ すばらしい！';
  else if(pct >= 80) msg = 'とてもよくできました！';
  else if(pct >= 60) msg = 'もう少し！ 見直してみよう';
  else msg = 'ノートを見直して、もう一度挑戦しよう';
  const modeNote = state.wrongOnlyMode ? '（まちがえた問題のみ）' : '';
  document.getElementById('res-msg').textContent = `正答率 ${pct}％　${msg}${modeNote}`;

  const retryWrongBtn = document.getElementById('btn-retry-wrong');
  if(state.wrong.length > 0){
    retryWrongBtn.style.display = 'block';
    retryWrongBtn.textContent = `間違えた${state.wrong.length}問だけやり直す`;
  } else {
    retryWrongBtn.style.display = 'none';
  }

  const reviewHolder = document.getElementById('review-holder');
  reviewHolder.innerHTML = '';
  if(state.wrong.length > 0){
    const title = document.createElement('h2');
    title.className = 'section-title';
    title.textContent = '間違えた問題の復習（まちがえ帳に保存しました）';
    reviewHolder.appendChild(title);

    state.wrong.forEach(w=>{
      const div = document.createElement('div');
      div.className = 'review-item';
      div.innerHTML = `
        <div class="review-q">${w.q}</div>
        <div class="review-a">あなたの答え：<span class="your">${w.your}</span>　→　正解：<span class="right">${w.right}</span></div>
        <div class="review-a" style="margin-top:4px;">${w.note}</div>
      `;
      reviewHolder.appendChild(div);
    });
  }

  showScreen('result');
}
</script>
